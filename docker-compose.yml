services:
  db:
    image: postgres:16
    # Como RDS con PostgreSQL 16 (rds.force_ssl=1): por la red solo se entra con TLS. El
    # certificado es el de prueba (snakeoil) que trae la imagen, que alcanza para cifrar en
    # local y en el CI. pg_hba.conf rechaza las conexiones por la red que no usan TLS.
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      - -c
      - ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: retail_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ver .env.example)}"
      POSTGRES_DB: orders
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    # Sin "ports": solo se llega desde la red interna de compose (db:5432)
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante el init el server temporal solo escucha en socket Unix
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U retail_user -d orders"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    # Con contraseña, como el ElastiCache de la nube. La clave llega en un archivo de
    # configuración que arma compose (ver "configs" al final), así no queda en la línea de
    # comandos ni en el entorno del contenedor.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    configs:
      - source: redis-conf
        target: /usr/local/etc/redis/redis.conf
    # Sin "ports": solo se llega desde la red interna de compose (redis:6379)

  catalog:
    build:
      context: ./src/catalog
    environment:
      GIN_MODE: release
      RETAIL_CATALOG_PERSISTENCE_PROVIDER: postgres
      RETAIL_CATALOG_PERSISTENCE_ENDPOINT: db:5432
      RETAIL_CATALOG_PERSISTENCE_DB_NAME: catalogdb
      RETAIL_CATALOG_PERSISTENCE_USER: retail_user
      RETAIL_CATALOG_PERSISTENCE_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ver .env.example)}"
      # Sin variable de sslmode, a propósito: los cuatro servicios con base usan require por
      # defecto, el mismo valor que van a tener en la nube, y así la prueba de humo lo prueba.
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  carts:
    build:
      context: ./src/cart
    environment:
      CART_PERSISTENCE_PROVIDER: postgres
      CART_POSTGRES_HOST: db
      CART_POSTGRES_PORT: "5432"
      CART_POSTGRES_DB: cartdb
      CART_POSTGRES_USER: retail_user
      CART_POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ver .env.example)}"
      PORT: "8080"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  orders:
    build:
      context: ./src/orders
    environment:
      GIN_MODE: release
      RETAIL_ORDERS_PERSISTENCE_ENDPOINT: db:5432
      RETAIL_ORDERS_PERSISTENCE_NAME: orders
      RETAIL_ORDERS_PERSISTENCE_USERNAME: retail_user
      RETAIL_ORDERS_PERSISTENCE_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ver .env.example)}"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

  checkout:
    build:
      context: ./src/checkout
    environment:
      RETAIL_CHECKOUT_PERSISTENCE_PROVIDER: redis
      RETAIL_CHECKOUT_PERSISTENCE_REDIS_URL: redis://redis:6379
      RETAIL_CHECKOUT_PERSISTENCE_REDIS_PASSWORD: "${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env (ver .env.example)}"
      RETAIL_CHECKOUT_ENDPOINTS_ORDERS: http://orders:8080
    restart: on-failure
    depends_on:
      - redis
      - orders

  ui:
    build:
      context: ./src/ui
    environment:
      RETAIL_UI_ENDPOINTS_CATALOG:  http://catalog:8080
      RETAIL_UI_ENDPOINTS_CARTS:    http://carts:8080
      RETAIL_UI_ENDPOINTS_CHECKOUT: http://checkout:8080
      RETAIL_UI_ENDPOINTS_ORDERS:   http://orders:8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - catalog
      - carts
      - orders
      - checkout

  admin:
    build:
      context: ./src/admin
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: retail_user
      DB_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ver .env.example)}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env (ver .env.example)}"
      ADMIN_JWT_SECRET: "${ADMIN_JWT_SECRET:?Falta ADMIN_JWT_SECRET en .env (ver .env.example)}"
    ports:
      - "127.0.0.1:8081:8080"
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:

configs:
  # Compose arma este archivo con el valor del .env y lo copia al contenedor de redis. Las
  # comillas simples hacen que Redis acepte espacios y signos en la clave (no una comilla simple).
  # Compose no recrea redis si solo cambia la clave: ver "TLS y contraseñas" en el README.
  redis-conf:
    content: |
      requirepass '${REDIS_PASSWORD:?Falta REDIS_PASSWORD en .env (ver .env.example)}'
