# Reglas de acceso de PostgreSQL para docker compose: docker-compose.yml las monta en db y se
# las pasa a postgres con -c hba_file. Emulan RDS con PostgreSQL 16 (rds.force_ssl=1): por la
# red solo se entra con TLS. PostgreSQL usa la primera regla que coincide.
#
# TYPE   DATABASE  USER  ADDRESS  METHOD

# Socket Unix, dentro del contenedor, como en la imagen oficial: lo usan los scripts de
# inicio (init-db.sql) y las consultas de la prueba de humo.
local    all       all            trust

# Por la red (los servicios, y también 127.0.0.1): solo con TLS y con contraseña (SCRAM).
hostssl  all       all   all      scram-sha-256

# Por la red sin TLS: se rechaza.
host     all       all   all      reject
